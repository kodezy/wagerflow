name: ci

on:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:unit

  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://wagerflow:wagerflow@localhost:5432/wagerflow_test
      SQS_ENDPOINT: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: docker compose up -d --wait postgres
      - run: docker compose up -d ministack
      - name: wait for MiniStack SQS
        run: |
          bun -e '
            import { ListQueuesCommand, SQSClient } from "@aws-sdk/client-sqs";
            const client = new SQSClient({
              region: "us-east-1",
              endpoint: process.env.SQS_ENDPOINT,
              credentials: {
                accessKeyId: process.env.AWS_ACCESS_KEY_ID ?? "test",
                secretAccessKey: process.env.AWS_SECRET_ACCESS_KEY ?? "test",
              },
              maxAttempts: 1,
            });
            for (let i = 0; i < 30; i++) {
              const ac = new AbortController();
              const timer = setTimeout(() => ac.abort(), 2000);
              try {
                await client.send(new ListQueuesCommand({}), { abortSignal: ac.signal });
                process.exit(0);
              } catch {
                await Bun.sleep(1000);
              } finally {
                clearTimeout(timer);
              }
            }
            throw new Error("MiniStack SQS did not become ready");
          '
      - run: bun run test:integration
      - run: bun run test:concurrency
      - if: failure()
        run: docker compose logs postgres ministack
